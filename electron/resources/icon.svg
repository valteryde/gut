<!-- App icon: the gut mark (mint agent dot / clay human dot) on a dark
     rounded tile matching the app's window background. Render targets:
     icon.icns (mac), icon.png (linux + win conversion), generated by
     scripts/make-icons.sh -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#14161a"/>
  <mask id="cut">
    <rect width="64" height="64" fill="#fff"/>
    <circle cx="42" cy="32" r="20" fill="#000"/>
  </mask>
  <circle cx="20" cy="32" r="12.5" fill="#5ee3bd" mask="url(#cut)"/>
  <circle cx="42" cy="32" r="15" fill="#dd8f6b"/>
</svg>
