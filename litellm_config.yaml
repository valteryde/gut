# LiteLLM proxy configuration for Gut.
#
# Provider keys reach the proxy through the agent daemon, not this file:
# for every key it knows — env vars shared with it (.env / gut-bot.env) or
# keys pushed from the app (POST /api/keys, stored in provider_keys.json) —
# it registers that provider's models here via the DB-backed model store
# (deployment ids "gut-*"). Keep provider models out of model_list: a
# static entry suppresses the managed deployment of the same name, and an
# os.environ/ key that isn't set leaves a dead model that fails at call
# time. Static entries are still right for custom setups like a local
# Ollama api_base — see the example at the bottom.
#
# IMPORTANT for the agent: screenshot perception requires a *vision-capable*
# model (claude-*, gpt-4o, gemini-*, qwen-vl, llava, …). Text-only models
# will run but the agent will be blind.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Lets the daemon add/update/remove model deployments at runtime via the
  # /model/* admin API — this is how UI-pushed provider keys take effect.
  store_model_in_db: true

litellm_settings:
  # Keep request/response bodies out of spend logs by default.
  store_prompts_in_spend_logs: false
  # Generous timeout for long agent turns.
  request_timeout: 600

model_list: []

# ── Custom/static model example (local weights, extra providers) ─────────
# - model_name: ollama-qwen-vl
#   litellm_params:
#     model: ollama/qwen2.5vl:7b
#     api_base: os.environ/OLLAMA_API_BASE
