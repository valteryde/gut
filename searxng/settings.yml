# SearXNG for the Gut stack — mounted into the searxng compose service
# (see docker-compose.yml). Merged over SearXNG's own defaults.
use_default_settings: true

server:
  # The service is never published — it only exists on the internal compose
  # network — so a committed key is fine. Regenerate (`openssl rand -hex 32`)
  # if you ever expose it.
  secret_key: "6b3f9a2c7e4d18f0b5c9a3e7d2f6b1c8a4e0d9f3b7c5a1e8d4f2b6c0a9e3d7f1b"
  limiter: false      # the daemon's queries would trip the bot detection
  image_proxy: false
  method: "GET"

search:
  formats:
    - html
    - json            # web_search calls /search?format=json — off by default
