name: release

# One tag → all artifacts, same version everywhere:
#   ghcr.io/valteryde/gut-desktop:<v>  (+ :latest)   — for the Electron app
#   gut-bot_<v>_{amd64,arm64}.deb                    — for bare Debian/Ubuntu
#   gut-<v>.dmg / .exe / .AppImage                   — the desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 0.4.0)'
        required: true

permissions:
  contents: write
  packages: write

# Tags are 'v0.4.0'; artifacts get the bare '0.4.0' (deb versions must start
# with a digit). Each job resolves VERSION into its own env first.
#
# amd64 and arm64 build on native runners (ubuntu-latest / ubuntu-24.04-arm)
# — no QEMU. Per-arch images are pushed as <v>-<arch>, then merged into the
# multi-arch <v> / :latest manifest by image-manifest.

jobs:
  image:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        shell: bash
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push gut-desktop (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: GUT_VERSION=${{ env.VERSION }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gut-desktop:${{ env.VERSION }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        shell: bash
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge per-arch images into multi-arch tags
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/gut-desktop"
          docker buildx imagetools create \
            -t "$IMG:${{ env.VERSION }}" -t "$IMG:latest" \
            "$IMG:${{ env.VERSION }}-amd64" "$IMG:${{ env.VERSION }}-arm64"

  deb:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        shell: bash
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"
      - name: Build deb inside debian:trixie (${{ matrix.arch }})
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie \
            bash packaging/build-deb.sh "${{ env.VERSION }}" "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  electron:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        shell: bash
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp version + build
        working-directory: electron
        run: |
          npm pkg set version="${{ env.VERSION }}"
          npm install --no-audit --no-fund
          npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb
          if-no-files-found: error

  publish:
    needs: [image-manifest, deb, electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
