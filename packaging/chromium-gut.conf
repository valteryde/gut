# Sourced by /usr/bin/chromium on every launch — CLI, .desktop icons, xdg-open.
# --no-sandbox: gut-bot hosts may lack unprivileged user namespaces (VMs,
# restricted kernels); the dedicated desktop is the isolation boundary.
# DevTools stays on localhost:9222 for the agent's CDP browser_* tools —
# never expose it, CDP is unauthenticated full browser control.
export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --no-sandbox --disable-setuid-sandbox --remote-debugging-address=127.0.0.1 --remote-allow-origins=* --remote-debugging-port=${CDP_PORT:-9222} --user-data-dir=${HOME}/.gut-chrome --force-device-scale-factor=${UI_SCALE:-1.25}"
