<!-- two overlapping dots: mint agent, clay human — mirrors .brand .mark in
     styles.css (colors are the client design tokens). The mint dot is really
     cut out around the clay dot, so the gap shows whatever is behind. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <mask id="cut">
    <rect width="64" height="64" fill="#fff"/>
    <circle cx="42" cy="32" r="20" fill="#000"/>
  </mask>
  <circle cx="20" cy="32" r="12.5" fill="#5ee3bd" mask="url(#cut)"/>
  <circle cx="42" cy="32" r="15" fill="#dd8f6b"/>
</svg>
